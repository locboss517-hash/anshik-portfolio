<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Geometric isometric pattern -->
    <pattern id="iso-grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 80 M 0 0 L 80 80" stroke="currentColor" stroke-width="0.5" stroke-opacity="0.12" />
      <circle cx="40" cy="40" r="1" fill="currentColor" fill-opacity="0.25" />
    </pattern>
    <pattern id="fine-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="currentColor" fill-opacity="0.18" />
    </pattern>
  </defs>

  <!-- Architectural grid background fill -->
  <rect width="1920" height="1200" fill="url(#iso-grid)" />
  <rect width="1920" height="1200" fill="url(#fine-dots)" />

  <!-- Blueprint Architectural Venture Lines -->
  <g stroke="currentColor" stroke-opacity="0.15" stroke-width="1">
    <!-- Perspective perspective axis -->
    <line x1="100" y1="200" x2="1820" y2="200" stroke-dasharray="8 8" />
    <line x1="960" y1="50" x2="960" y2="1150" stroke-dasharray="4 8" />
    
    <!-- Architectural Framings in Top Right (Behind 3D hero visual) -->
    <polygon points="1200,150 1700,280 1550,680 1050,550" fill="none" stroke-width="1.2" stroke-opacity="0.22" />
    <polygon points="1250,200 1650,310 1520,630 1120,520" fill="none" stroke-width="0.75" stroke-dasharray="6 6" stroke-opacity="0.16" />
    <line x1="1200" y1="150" x2="1250" y2="200" />
    <line x1="1700" y1="280" x2="1650" y2="310" />
    <line x1="1550" y1="680" x2="1520" y2="630" />
    <line x1="1050" y1="550" x2="1120" y2="520" />

    <!-- Crosshair coordinates -->
    <g transform="translate(300, 350)">
      <line x1="-15" y1="0" x2="15" y2="0" stroke-width="1.5" />
      <line x1="0" y1="-15" x2="0" y2="15" stroke-width="1.5" />
      <circle cx="0" cy="0" r="8" fill="none" stroke-width="1" />
    </g>
    <g transform="translate(1620, 480)">
      <line x1="-15" y1="0" x2="15" y2="0" stroke-width="1.5" />
      <line x1="0" y1="-15" x2="0" y2="15" stroke-width="1.5" />
      <circle cx="0" cy="0" r="8" fill="none" stroke-width="1" />
    </g>
    <g transform="translate(820, 850)">
      <line x1="-12" y1="0" x2="12" y2="0" stroke-width="1.2" />
      <line x1="0" y1="-12" x2="0" y2="12" stroke-width="1.2" />
      <circle cx="0" cy="0" r="6" fill="none" stroke-width="0.8" />
    </g>

    <!-- Structural geometric elevation marks -->
    <path d="M 150 750 L 350 750 L 450 650 L 750 650 L 850 750 L 1150 750" fill="none" stroke-width="1" stroke-dasharray="10 5" stroke-opacity="0.18" />
    <path d="M 1250 820 L 1400 920 L 1750 920" fill="none" stroke-width="1" stroke-dasharray="8 6" stroke-opacity="0.16" />
  </g>
</svg>
